[project]
name = "orlando-sgro-294860"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pylint>=4.1.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "ty>=0.0.86",
]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.pylint]
ignore = [".venv", "venv", "check.py", "lint.py"]
disable = ["redefined-outer-name"]

[tool.pytest.ini_options]
addopts = "--cov=solution --cov=utils"